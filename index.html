<!-- اسکریپت -->
<script>
// ثابت‌ها
const SYSTEM_PROMPT = '';
const MODEL_POLLINATIONS = 'pollinations/ai';

const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

const welcomeScreen = document.getElementById('welcome-screen');
const loadingIndicator = document.getElementById('loading-indicator');

const fileAttachmentLabel = document.getElementById('file-attachment-label');
const fileNameDisplay = document.getElementById('file-name-display');

const apiKeyInput = document.getElementById('api-key-input');
const loadModelsBtn = document.getElementById('load-models-btn');
const freeEntryBtn = document.getElementById('free-entry-btn');
const apiKeyBadge = document.getElementById('api-key-badge');
const keyDot = document.getElementById('key-dot');
const keyLabel = document.getElementById('key-label');

const modelSelect = document.getElementById('model-select');
const modelSelectWrap = document.getElementById('model-select-wrap');

let apiKey = localStorage.getItem('sh3n_api_key') || '';
let isFreeMode = false;
let chatHistory = [];
let lastRequestTime = 0;
let attachedFileContent = '';
let attachedFileName = '';
let currentModel = MODEL_POLLINATIONS;

// Helper functions
function escapeHTML(str) {
  return String(str).replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));
}

function scrollToBottom() {
  setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
}

function setSendBtnState(hasText) {
  const enabled = hasText || attachedFileContent !== '';
  sendBtn.disabled = !enabled;
  if (enabled) {
    sendBtn.classList.remove('bg-[#424242]', 'text-[#ececec]');
    sendBtn.classList.add('bg-white', 'text-black');
  } else {
    sendBtn.classList.add('bg-[#424242]', 'text-[#ececec]');
    sendBtn.classList.remove('bg-white', 'text-black');
  }
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    attachedFileContent = reader.result;
    attachedFileName = file.name;
    fileNameDisplay.textContent = file.name;
    fileAttachmentLabel.classList.remove('hidden');
    userInput.dispatchEvent(new Event('input'));
    userInput.focus();
  };
  reader.readAsText(file);
  event.target.value = '';
}

function removeAttachedFile() {
  attachedFileContent = '';
  attachedFileName = '';
  fileAttachmentLabel.classList.add('hidden');
  userInput.dispatchEvent(new Event('input'));
}

// افزودن پیام کاربر
function appendUserMessage(text, index) {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-row user';

  const messageDiv = document.createElement('div');
  messageDiv.className = 'message';

  // جایگزینی خطوط جدید با <br>
  messageDiv.innerHTML = escapeHTML(text).replace(/\n/g, '<br>');

  wrapper.appendChild(messageDiv);
  chatBox.appendChild(wrapper);
  scrollToBottom();
}

// افزودن پیام ربات
function appendBotMessage(text, index) {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-row bot';

  const messageDiv = document.createElement('div');
  messageDiv.className = 'message';

  messageDiv.innerHTML = escapeHTML(text).replace(/\n/g, '<br>');

  wrapper.appendChild(messageDiv);
  chatBox.appendChild(wrapper);
  scrollToBottom();
}

// کپی کردن پیام
function copyMessage(btn) {
  const text = decodeURIComponent(btn.getAttribute('data-content'));
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.innerHTML;
    btn.innerHTML = `<svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
    setTimeout(() => { btn.innerHTML = original; }, 2000);
  });
}

// ویرایش پیام کاربر
function editUserMessage(index) {
  // پیدا کردن آخرین پیام کاربر
  let lastUserMsg = '';
  let userIdx = -1;
  for (let i = chatHistory.length - 1; i >= 0; i--) {
    if (chatHistory[i].role === 'user') {
      lastUserMsg = chatHistory[i].content;
      userIdx = i;
      break;
    }
  }
  if (lastUserMsg && userIdx !== -1) {
    // حذف پیام‌های بعدی
    chatHistory = chatHistory.slice(0, userIdx);
    // قرار دادن متن در input
    userInput.value = lastUserMsg;
    userInput.focus();
    setSendBtnState(true);
  }
}

// تلاش مجدد برای پیام
function retryMessage(index) {
  // مشابه ویرایش
  let lastUserMsg = '';
  let userIdx = -1;
  for (let i = chatHistory.length - 1; i >= 0; i--) {
    if (chatHistory[i].role === 'user') {
      lastUserMsg = chatHistory[i].content;
      userIdx = i;
      break;
    }
  }
  if (lastUserMsg && userIdx !== -1) {
    chatHistory = chatHistory.slice(0, userIdx);
    userInput.value = lastUserMsg;
    userInput.focus();
    sendMessage();
  }
}

// شروع چت جدید
function newChat() {
  chatHistory = [];
  document.querySelectorAll('.msg-row').forEach(el => el.remove());
  chatHistory.push({ role: 'system', content: SYSTEM_PROMPT });
  userInput.value = '';
  setSendBtnState(false);
  removeAttachedFile();
  welcomeScreen.style.display = 'flex';
  setTimeout(() => { welcomeScreen.style.opacity = '1'; }, 50);
}

// ارسال پیام
async function sendMessage() {
  let text = userInput.value.trim();
  if (attachedFileContent) {
    text += `\n[محتوای فایل ضمیمه شده: ${attachedFileName}]\n\`\`\`\n${attachedFileContent}\n\`\`\`\n`;
    removeAttachedFile();
  }
  if (!text) return;

  // پنهان کردن صفحه خوش‌آمد
  welcomeScreen.style.opacity = '0';
  setTimeout(() => { welcomeScreen.style.display = 'none'; }, 300);

  // افزودن پیام کاربر
  const msgIndex = chatHistory.length;
  appendUserMessage(text, msgIndex);
  chatHistory.push({ role: 'user', content: text });

  userInput.value = '';
  setSendBtnState(false);
  scrollToBottom();

  // نشان دادن لودینگ
  loadingIndicator.classList.remove('hidden');

  try {
    let reply = '';

    if (isFreeMode || currentModel === MODEL_POLLINATIONS) {
      // درخواست به Pollinations
      const recentMessages = chatHistory.slice(-10);
      const body = {
        messages: recentMessages,
        model: 'openai-fast',
        stream: false
      };
      const response = await fetch('https://text.pollinations.ai/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        if (response.status === 429) {
          await new Promise(res => setTimeout(res, 4000));
          return sendMessage();
        }
        throw new Error(`خطا در درخواست: ${response.status}`);
      }
      const rawText = await response.text();
      let parsed = null;
      try { parsed = JSON.parse(rawText); } catch (e) { parsed = null; }
      if (parsed) {
        reply = extractPollinationsContent(parsed);
      } else {
        reply = rawText;
      }
    } else {
      // درخواست به OpenRouter
      if (!apiKey) throw new Error('کلید API وارد نشده است.');
      const recentMessages = chatHistory.slice(-10);
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: currentModel,
          messages: recentMessages
        })
      });
      if (!response.ok) {
        if (response.status === 429) {
          await new Promise(res => setTimeout(res, 4000));
          return sendMessage();
        }
        throw new Error(`خطای سرور: ${response.status}`);
      }
      const data = await response.json();
      reply = data.choices?.[0]?.message?.content || 'پاسخی دریافت نشد.';
    }

    chatHistory.push({ role: 'assistant', content: reply });
    // افزودن پاسخ به صفحه
    appendBotMessage(reply, chatHistory.length - 1);
  } catch (err) {
    console.error(err);
    // نمایش خطا در صفحه
    const errorDiv = document.createElement('div');
    errorDiv.className = 'msg-row flex justify-end';
    errorDiv.innerHTML = `
      <div class="bot-msg group relative text-red-400 font-mono">
        <div class="flex-shrink-0 mt-1">
          <img src="https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png" class="w-7 h-7 rounded-full border border-red-900 bg-[#1a0000]" />
        </div>
        <div class="flex-1 pt-1 whitespace-pre-wrap pb-4 max-w-[85%]">
          <div class="border border-red-900 bg-red-950 p-2 rounded-lg">
            <div class="font-bold">خطا در ارتباط با سرور</div>
            <div class="mt-1">${escapeHTML(err.message)}</div>
            <div class="mt-1 text-sm">لطفاً چند لحظه صبر کنید و دوباره تلاش کنید.</div>
          </div>
        </div>
      </div>`;
    chatBox.appendChild(errorDiv);
  } finally {
    loadingIndicator.classList.add('hidden');
    scrollToBottom();
  }
}

// استخراج محتوای پاسخ Pollinations
function extractPollinationsContent(data) {
  if (typeof data === 'string') return data;
  if (!data || typeof data !== 'object') return '';

  if (data.choices && Array.isArray(data.choices) && data.choices.length > 0) {
    const choice = data.choices[0];
    if (choice.message && typeof choice.message.content === 'string') return choice.message.content;
    if (typeof choice.text === 'string') return choice.text;
    if (choice.delta && typeof choice.delta.content === 'string') return choice.delta.content;
  }

  if (typeof data.content === 'string') return data.content;
  if (typeof data.text === 'string') return data.text;
  if (typeof data.response === 'string') return data.response;
  if (typeof data.result === 'string') return data.result;
  if (typeof data.output === 'string') return data.output;

  return '';
}

// بارگذاری مدل‌ها
async function fetchModels(key) {
  const res = await fetch('https://openrouter.ai/api/v1/models', {
    headers: { 'Authorization': `Bearer ${key}` }
  });
  if (!res.ok) throw new Error('خطا در بارگذاری مدل‌ها');
  const data = await res.json();
  return data.data || [];
}

// ساخت لیست مدل‌ها در انتخاب
function buildModelList(models) {
  modelSelect.innerHTML = '';

  // افزودن مدل رایگان
  const optFree = document.createElement('option');
  optFree.value = MODEL_POLLINATIONS;
  optFree.textContent = '✨ رایگان · Pollinations.ai';
  optFree.dataset.free = 'true';
  modelSelect.appendChild(optFree);

  // مدل‌های دیگر
  models.forEach(m => {
    const option = document.createElement('option');
    option.value = m.id || m;
    option.textContent = m.name || m.id || m;
    option.dataset.free = (m.pricing && m.pricing.prompt === 0 && m.pricing.completion === 0) ? 'true' : 'false';
    modelSelect.appendChild(option);
  });

  modelSelect.value = MODEL_POLLINATIONS;
  currentModel = MODEL_POLLINATIONS;
  isFreeMode = true;
  modelSelectWrap.style.display = 'inline-block';

  // تنظیم onchange
  modelSelect.onchange = () => {
    if (modelSelect.value === MODEL_POLLINATIONS) {
      isFreeMode = true;
      currentModel = MODEL_POLLINATIONS;
    } else {
      isFreeMode = false;
      currentModel = modelSelect.value;
    }
  };
}

// رویدادهای اولیه
document.getElementById('load-models-btn').onclick = async () => {
  const key = apiKeyInput.value.trim();
  if (!key) {
    document.getElementById('login-error').textContent = 'لطفاً کلید API وارد کنید.';
    return;
  }
  try {
    const models = await fetchModels(key);
    localStorage.setItem('sh3n_api_key', key);
    buildModelList(models);
    document.getElementById('login-overlay').classList.add('hidden');
  } catch (err) {
    document.getElementById('login-error').textContent = err.message;
  }
};

document.getElementById('free-entry-btn').onclick = () => {
  chatHistory = [{ role: 'system', content: SYSTEM_PROMPT }];
  document.getElementById('login-overlay').classList.add('hidden');
  userInput.focus();
  isFreeMode = true;
  currentModel = MODEL_POLLINATIONS;
  modelSelect.value = MODEL_POLLINATIONS;
  modelSelectWrap.style.display = 'inline-block';
};

// رویدادهای پیام
sendBtn.onclick = () => {
  if (!sendBtn.disabled) sendMessage();
};

userInput.oninput = () => {
  setSendBtnState(userInput.value.trim() !== '' || attachedFileContent !== '');
};

userInput.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
};

// بارگذاری اولیه
(async () => {
  const savedKey = localStorage.getItem('sh3n_api_key');
  if (savedKey) {
    try {
      const models = await fetchModels(savedKey);
      localStorage.setItem('sh3n_api_key', savedKey);
      buildModelList(models);
      document.getElementById('login-overlay').classList.add('hidden');
    } catch {
      document.getElementById('login-overlay').classList.remove('hidden');
    }
  } else {
    document.getElementById('login-overlay').classList.remove('hidden');
  }
})();
